<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-A-I AIアドバイザー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --bg2: #111118; --bg3: #1a1a24;
    --border: rgba(255,255,255,0.08); --text: #f0efe8; --text2: #9998a0;
    --accent: #c8f564; --accent2: rgba(200,245,100,0.1);
    --purple: #a78bfa; --purple2: rgba(167,139,250,0.1);
    --blue: #38bdf8; --blue2: rgba(56,189,248,0.1);
    --coral: #ff6b6b; --coral2: rgba(255,107,107,0.1);
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  .header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .badge { font-size: 10px; font-weight: 600; color: var(--accent); background: var(--accent2); padding: 3px 8px; border-radius: 100px; }
  .status { margin-left: auto; font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .message { display: flex; gap: 10px; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .message.user { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .avatar.ai { background: var(--accent2); color: var(--accent); border: 1px solid rgba(200,245,100,0.2); }
  .avatar.me { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
  .bubble { max-width: calc(100% - 46px); padding: 11px 14px; border-radius: 16px; font-size: 14px; line-height: 1.65; }
  .message.ai .bubble { background: var(--bg2); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .message.user .bubble { background: var(--accent2); border: 1px solid rgba(200,245,100,0.2); border-top-right-radius: 4px; }
  .bubble img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; max-height: 180px; object-fit: cover; }
  .bubble video { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; max-height: 180px; }
  .bubble strong { font-weight: 600; }
  .bubble code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; font-family: monospace; font-size: 12px; color: var(--accent); }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0; }
  .bubble li { margin: 3px 0; }

  /* AI model badge in bubble */
  .model-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 100px; margin-bottom: 8px; }
  .model-badge.gemini { background: rgba(56,189,248,0.1); color: var(--blue); border: 1px solid rgba(56,189,248,0.2); }
  .model-badge.claude { background: var(--accent2); color: var(--accent); border: 1px solid rgba(200,245,100,0.2); }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text2); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* Loading step indicator */
  .loading-steps { padding: 8px 0; }
  .loading-step { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .loading-step.done { color: var(--accent); }
  .loading-step.active { color: var(--text); }
  .step-icon { width: 14px; text-align: center; }

  .bottom { flex-shrink: 0; border-top: 1px solid var(--border); }

  /* Attachment preview */
  .attachment-area { display: none; padding: 12px 20px 0; }
  .attachment-area.show { display: flex; gap: 10px; align-items: flex-start; }
  .attach-thumb { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
  .attach-thumb img, .attach-thumb video { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
  .attach-type { position: absolute; bottom: 4px; left: 4px; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 100px; }
  .attach-type.video { background: var(--blue); color: #fff; }
  .attach-type.image { background: var(--purple); color: #fff; }
  .remove-attach { position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%; background: #ff4444; color: white; font-size: 11px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .attach-info { font-size: 12px; color: var(--text2); padding-top: 4px; line-height: 1.6; }
  .attach-info .highlight { color: var(--purple); font-weight: 600; font-size: 12px; }
  .attach-info .video-highlight { color: var(--blue); font-weight: 600; font-size: 12px; }

  /* Content action buttons */
  .content-actions { display: none; padding: 10px 20px 0; gap: 6px; flex-wrap: wrap; }
  .content-actions.show { display: flex; }
  .ca-btn { padding: 6px 14px; border-radius: 100px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; border: 1px solid; }
  .ca-btn.green  { border-color: rgba(200,245,100,0.3); background: var(--accent2); color: var(--accent); }
  .ca-btn.purple { border-color: rgba(167,139,250,0.3); background: var(--purple2); color: var(--purple); }
  .ca-btn.blue   { border-color: rgba(56,189,248,0.3);   background: var(--blue2);   color: var(--blue); }
  .ca-btn.coral  { border-color: rgba(255,107,107,0.3);  background: var(--coral2);  color: var(--coral); }
  .ca-btn:hover { opacity: 0.8; }

  /* Video note */
  .video-note { margin: 8px 20px 0; padding: 8px 12px; background: var(--blue2); border: 1px solid rgba(56,189,248,0.2); border-radius: 10px; font-size: 11px; color: var(--blue); display: none; }
  .video-note.show { display: block; }

  .quick-replies { padding: 10px 20px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-btn { padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 11px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent2); }

  .input-area { padding: 10px 20px 20px; }
  .input-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; display: flex; gap: 10px; align-items: flex-end; transition: border-color 0.2s; }
  .input-box:focus-within { border-color: rgba(200,245,100,0.4); }
  .input-box textarea { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; line-height: 1.5; resize: none; max-height: 100px; min-height: 22px; font-family: inherit; }
  .input-box textarea::placeholder { color: var(--text2); }
  .img-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all 0.2s; flex-shrink: 0; }
  .img-btn:hover { border-color: var(--purple); color: var(--purple); background: var(--purple2); }
  .img-btn.has-file { border-color: var(--purple); color: var(--purple); background: var(--purple2); }
  .send-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--accent); color: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: opacity 0.2s; flex-shrink: 0; }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #file-input { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">L-<span>A</span>-I</div>
  <div class="badge">AIアドバイザー</div>
  <div class="status"><div class="dot"></div>オンライン</div>
</div>

<div class="chat" id="chat"></div>

<div class="bottom">
  <div class="attachment-area" id="attachArea">
    <div class="attach-thumb">
      <img id="attachThumbImg" src="" alt="" style="display:none;">
      <video id="attachThumbVideo" muted playsinline style="display:none;"></video>
      <span class="attach-type" id="attachType"></span>
      <button class="remove-attach" onclick="removeAttachment()">×</button>
    </div>
    <div class="attach-info" id="attachInfo"></div>
  </div>

  <div class="video-note" id="videoNote">
    🎬 動画はGemini AIが全フレームを分析 → Claudeが日本語アドバイスを生成します
  </div>

  <div class="content-actions" id="contentActions">
    <button class="ca-btn green"  onclick="runContent('evaluate')">📊 投稿評価</button>
    <button class="ca-btn purple" onclick="runContent('caption')">✏️ キャプション</button>
    <button class="ca-btn blue"   onclick="runContent('hashtag')"># ハッシュタグ</button>
    <button class="ca-btn coral"  onclick="runContent('all')">✨ 全部まとめて</button>
  </div>

  <div class="quick-replies" id="quickReplies">
    <button class="quick-btn" onclick="sendQuick('先週のパフォーマンスを分析して')">先週の分析</button>
    <button class="quick-btn" onclick="sendQuick('最適な投稿時間を教えて')">最適投稿時間</button>
    <button class="quick-btn" onclick="sendQuick('リールとカルーセルどちらを増やすべき？')">形式の比較</button>
    <button class="quick-btn" onclick="sendQuick('フォロワーを増やすために今すぐできることは？')">フォロワー増加</button>
    <button class="quick-btn" onclick="sendQuick('JKTとWKSを比較してどちらに注力すべき？')">アカウント比較</button>
    <button class="quick-btn" onclick="sendQuick('来週の投稿プランを作って')">投稿プラン</button>
    <button class="quick-btn" onclick="sendQuick('広告に¥5,000使うとしたらどう使う？')">広告戦略</button>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="input" placeholder="何でも聞いてください、または画像・動画を添付してください..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="img-btn" id="imgBtn" onclick="document.getElementById('file-input').click()" title="画像・動画を添付">📎</button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
    <input type="file" id="file-input" accept="image/*,video/*" onchange="handleFile(event)">
  </div>
</div>

<script>
const chatEl         = document.getElementById('chat');
const inputEl        = document.getElementById('input');
const sendBtn        = document.getElementById('sendBtn');
const attachArea     = document.getElementById('attachArea');
const contentActions = document.getElementById('contentActions');
const quickReplies   = document.getElementById('quickReplies');
const videoNote      = document.getElementById('videoNote');
const imgBtn         = document.getElementById('imgBtn');

let messages     = [];
let clientId     = 'C001';
let isLoading    = false;
let attached     = null; // { data, type, url, isVideo, fileName }

window.addEventListener('load', () => {
  addMsg('ai', 'こんにちは！L-A-Iアドバイザーです。\n\nJKTとWKSのデータを参照してリアルタイムでアドバイスします。\n\n**📎 画像・動画を添付**してコンテンツ評価・キャプション・ハッシュタグを生成できます。\n動画は**Gemini AIが全フレームを分析**し、Claudeが日本語アドバイスを生成します。\n\n何でも聞いてください！');
});

function fmt(t) {
  return t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/`(.*?)`/g, '<code>$1</code>')
          .replace(/\n/g, '<br>');
}

function addMsg(role, content, mediaUrl = null, isVideo = false, modelInfo = null) {
  const d  = document.createElement('div'); d.className = `message ${role}`;
  const av = document.createElement('div'); av.className = `avatar ${role === 'ai' ? 'ai' : 'me'}`; av.textContent = role === 'ai' ? 'AI' : '私';
  const b  = document.createElement('div'); b.className = 'bubble';

  if (modelInfo) {
    const badge = document.createElement('div');
    badge.className = `model-badge ${modelInfo}`;
    badge.textContent = modelInfo === 'gemini' ? '🎬 Gemini + Claude' : '🤖 Claude';
    b.appendChild(badge);
    b.appendChild(document.createElement('br'));
  }

  const textNode = document.createElement('div');
  textNode.innerHTML = fmt(content);
  b.appendChild(textNode);

  if (mediaUrl) {
    if (isVideo) {
      const v = document.createElement('video'); v.src = mediaUrl; v.controls = true; v.muted = true;
      b.appendChild(v);
    } else {
      const i = document.createElement('img'); i.src = mediaUrl;
      b.appendChild(i);
    }
  }

  d.appendChild(av); d.appendChild(b);
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showTyping(steps = null) {
  const d  = document.createElement('div'); d.className = 'message ai'; d.id = 'typing';
  const av = document.createElement('div'); av.className = 'avatar ai'; av.textContent = 'AI';
  const b  = document.createElement('div'); b.className = 'bubble';

  if (steps) {
    const sl = document.createElement('div'); sl.className = 'loading-steps'; sl.id = 'loadingSteps';
    steps.forEach((s, i) => {
      const row = document.createElement('div'); row.className = `loading-step ${i === 0 ? 'active' : ''}`;
      row.id = `step-${i}`;
      row.innerHTML = `<span class="step-icon">${i === 0 ? '⟳' : '○'}</span> ${s}`;
      sl.appendChild(row);
    });
    b.appendChild(sl);
  } else {
    b.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  }

  d.appendChild(av); d.appendChild(b);
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function updateStep(stepIdx) {
  const steps = document.querySelectorAll('.loading-step');
  steps.forEach((s, i) => {
    if (i < stepIdx) { s.className = 'loading-step done'; s.querySelector('.step-icon').textContent = '✓'; }
    else if (i === stepIdx) { s.className = 'loading-step active'; s.querySelector('.step-icon').textContent = '⟳'; }
  });
}

function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function updateAttachUI(hasFile) {
  attachArea.classList.toggle('show', hasFile);
  contentActions.style.display = hasFile ? 'flex' : 'none';
  quickReplies.style.display   = hasFile ? 'none' : 'flex';
  imgBtn.classList.toggle('has-file', hasFile);
  videoNote.classList.toggle('show', hasFile && attached?.isVideo);
}

function handleFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const isVideo = f.type.startsWith('video');
  const r = new FileReader();
  r.onload = ev => {
    attached = { data: ev.target.result.split(',')[1], type: f.type, url: ev.target.result, isVideo, fileName: f.name };

    if (isVideo) {
      document.getElementById('attachThumbImg').style.display = 'none';
      const vEl = document.getElementById('attachThumbVideo');
      vEl.src = ev.target.result; vEl.style.display = 'block';
      document.getElementById('attachType').textContent = '動画'; document.getElementById('attachType').className = 'attach-type video';
      document.getElementById('attachInfo').innerHTML = `<span class="video-highlight">🎬 動画を添付しました</span><br>Gemini AIが全フレームを分析します`;
    } else {
      document.getElementById('attachThumbVideo').style.display = 'none';
      const iEl = document.getElementById('attachThumbImg');
      iEl.src = ev.target.result; iEl.style.display = 'block';
      document.getElementById('attachType').textContent = '画像'; document.getElementById('attachType').className = 'attach-type image';
      document.getElementById('attachInfo').innerHTML = `<span class="highlight">🖼️ 画像を添付しました</span><br>下のボタンで分析してください`;
    }
    updateAttachUI(true);
  };
  r.readAsDataURL(f);
  e.target.value = '';
}

function removeAttachment() {
  attached = null;
  document.getElementById('attachThumbImg').src = ''; document.getElementById('attachThumbImg').style.display = 'none';
  document.getElementById('attachThumbVideo').src = ''; document.getElementById('attachThumbVideo').style.display = 'none';
  updateAttachUI(false);
}

async function sendMessage(overridePrompt = null) {
  const text = overridePrompt || inputEl.value.trim();
  if (!text && !attached) return;
  if (isLoading) return;
  isLoading = true; sendBtn.disabled = true;

  const displayText = text || (attached?.isVideo ? '（動画を送信）' : '（画像を送信）');
  addMsg('user', displayText, attached?.url || null, attached?.isVideo || false);

  const usedAttach = attached ? { ...attached } : null;
  if (!overridePrompt) { inputEl.value = ''; autoResize(inputEl); }
  attached = null; updateAttachUI(false);

  if (usedAttach?.isVideo) {
    // 動画: Gemini + Claude の2段階処理
    showTyping([
      'Geminiが動画を全フレーム分析中...',
      'Claudeが日本語アドバイスを生成中...',
    ]);

    try {
      setTimeout(() => updateStep(0), 500);

      const res  = await fetch('/api/advisor-video', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          videoData: usedAttach.data,
          videoMimeType: usedAttach.type,
          clientId,
          prompt: text || '投稿として評価・改善点・キャプション案・ハッシュタグを提案してください。',
        }),
      });
      const data = await res.json();

      setTimeout(() => updateStep(1), 100);
      await new Promise(r => setTimeout(r, 800));

      hideTyping();
      if (data.content) {
        addMsg('ai', data.content, null, false, 'gemini');
        messages.push({ role: 'user', content: `[動画分析] ${text || '全部まとめて評価してください'}` });
        messages.push({ role: 'assistant', content: data.content });
      } else {
        addMsg('ai', `分析中にエラーが発生しました。\n\nGemini分析結果:\n${data.geminiAnalysis || 'なし'}`);
      }
    } catch (e) {
      hideTyping();
      addMsg('ai', `エラーが発生しました: ${e.message}`);
    }
  } else {
    // 画像またはテキスト: Claude
    const uc = [];
    if (usedAttach) uc.push({ type: 'image', source: { type: 'base64', media_type: usedAttach.type, data: usedAttach.data } });
    if (text) uc.push({ type: 'text', text });
    const msgContent = uc.length === 1 && uc[0].type === 'text' ? text : uc;
    messages.push({ role: 'user', content: msgContent });

    showTyping();
    try {
      const res  = await fetch('/api/advisor', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages, clientId }) });
      const data = await res.json();
      hideTyping();
      if (data.content) {
        addMsg('ai', data.content, null, false, usedAttach ? 'claude' : null);
        messages.push({ role: 'assistant', content: data.content });
      } else {
        addMsg('ai', 'エラーが発生しました。もう一度お試しください。');
      }
    } catch (e) {
      hideTyping(); addMsg('ai', 'エラーが発生しました。もう一度お試しください。');
    }
  }

  isLoading = false; sendBtn.disabled = false;
}

function runContent(type) {
  if (!attached) { alert('先にファイルを添付してください'); return; }
  const prompts = {
    evaluate: '投稿として詳しく評価してください。スコア・強み・改善点・予想パフォーマンスを過去データと比較して。',
    caption:  'この投稿に合うInstagramキャプションを3パターン生成してください。過去の成功投稿の傾向を踏まえて。インバウンド向けは日英バイリンガルで。',
    hashtag:  'この投稿に最適なハッシュタグを提案してください。必須タグ・ニッチタグ・バイラルタグ・インバウンド英語タグのカテゴリ別に。',
    all:      '以下を全部まとめてください: ①投稿評価（スコア・強み・改善点）②キャプション案3パターン ③ハッシュタグ提案（カテゴリ別）④最適な投稿タイミング',
  };
  inputEl.value = prompts[type];
  sendMessage();
}

function sendQuick(t) { inputEl.value = t; sendMessage(); }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
</script>
</body>
</html>
