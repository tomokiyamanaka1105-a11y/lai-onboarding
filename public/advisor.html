<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-A-I AIアドバイザー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:      #0a0a0f;
    --bg2:     #111118;
    --bg3:     #1a1a24;
    --border:  rgba(255,255,255,0.08);
    --text:    #f0efe8;
    --text2:   #9998a0;
    --accent:  #c8f564;
    --accent2: rgba(200,245,100,0.1);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .logo span { color: var(--accent); }

  .header-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
    background: var(--accent2);
    padding: 3px 8px;
    border-radius: 100px;
  }

  .account-selector {
    margin-left: auto;
    display: flex;
    gap: 6px;
  }

  .acc-btn {
    padding: 4px 12px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text2);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .acc-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent2);
  }

  /* Stats bar */
  .stats-bar {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 20px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }

  .stats-bar::-webkit-scrollbar { display: none; }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex-shrink: 0;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text2);
    letter-spacing: 0.05em;
  }

  .stat-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .stat-value.up   { color: var(--accent); }
  .stat-value.down { color: #ff6b6b; }

  /* Chat */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }

  .avatar.ai {
    background: var(--accent2);
    color: var(--accent);
    border: 1px solid rgba(200,245,100,0.2);
  }

  .avatar.user-av {
    background: var(--bg3);
    color: var(--text2);
    border: 1px solid var(--border);
  }

  .bubble {
    max-width: calc(100% - 46px);
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
  }

  .message.ai .bubble {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .message.user .bubble {
    background: var(--accent2);
    border: 1px solid rgba(200,245,100,0.2);
    border-top-right-radius: 4px;
  }

  /* Typing */
  .typing {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text2);
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30%           { transform: translateY(-6px); }
  }

  /* Quick replies */
  .quick-replies {
    padding: 0 20px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0;
  }

  .quick-btn {
    padding: 6px 12px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text2);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .quick-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent2);
  }

  /* Input */
  .input-area {
    padding: 10px 20px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    transition: border-color 0.2s;
  }

  .input-box:focus-within {
    border-color: rgba(200,245,100,0.4);
  }

  .input-box textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    max-height: 100px;
    min-height: 22px;
    font-family: inherit;
  }

  .input-box textarea::placeholder { color: var(--text2); }

  .send-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }

  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn:hover:not(:disabled) { opacity: 0.85; }

  /* Formatting */
  .bubble strong { font-weight: 600; }
  .bubble code {
    background: var(--bg3);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 12px;
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">L-<span>A</span>-I</div>
  <div class="header-badge">AIアドバイザー</div>
  <div class="account-selector">
    <button class="acc-btn active" onclick="switchClient('C001', this)">C001</button>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat">
    <div class="stat-label">読み込み中...</div>
    <div class="stat-value">—</div>
  </div>
</div>

<div class="chat" id="chat"></div>

<div class="quick-replies" id="quickReplies">
  <button class="quick-btn" onclick="sendQuick('先週のパフォーマンスを分析して')">先週の分析</button>
  <button class="quick-btn" onclick="sendQuick('今週どの曜日・時間に投稿すべき？')">最適投稿時間</button>
  <button class="quick-btn" onclick="sendQuick('リールとカルーセルどちらを増やすべき？')">形式の比較</button>
  <button class="quick-btn" onclick="sendQuick('フォロワーを増やすために今すぐできることは？')">フォロワー増加</button>
  <button class="quick-btn" onclick="sendQuick('JKTとWKSを比較して、どちらに注力すべき？')">アカウント比較</button>
  <button class="quick-btn" onclick="sendQuick('来週の投稿プランを作って')">投稿プラン作成</button>
  <button class="quick-btn" onclick="sendQuick('広告に¥5,000使うとしたらどう使う？')">広告戦略</button>
</div>

<div class="input-area">
  <div class="input-box">
    <textarea
      id="input"
      placeholder="データについて何でも聞いてください..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
  </div>
</div>

<script>
const chatEl    = document.getElementById('chat');
const inputEl   = document.getElementById('input');
const sendBtn   = document.getElementById('sendBtn');
const statsBar  = document.getElementById('statsBar');

let messages   = [];
let clientId   = 'C001';
let isLoading  = false;
let statsData  = null;

// 起動時にデータ取得
window.addEventListener('load', async () => {
  await loadStats();
  addMessage('ai', `こんにちは！L-A-Iアドバイザーです。\n\nJKTとWKSのデータを読み込みました。データについて何でも聞いてください。\n\n例えば「先週の分析をして」「来週の投稿プランを作って」など。`);
});

async function loadStats() {
  try {
    const res  = await fetch(`/api/advisor`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: 'データを確認してください' }], clientId }),
    });
    // statsはAPIから取得せず直接GASから取得
    statsBar.innerHTML = `
      <div class="stat"><div class="stat-label">JKT フォロワー</div><div class="stat-value">読込中</div></div>
      <div class="stat"><div class="stat-label">WKS フォロワー</div><div class="stat-value">読込中</div></div>
    `;
  } catch (e) {
    statsBar.innerHTML = `<div class="stat"><div class="stat-label">データ</div><div class="stat-value up">接続済み</div></div>`;
  }

  // GAS APIから直接スタッツ取得
  try {
    const gasUrl = '/api/gas-proxy?clientId=' + clientId + '&type=summary';
    // プロキシ経由でGASデータ取得（後で実装）
    statsBar.innerHTML = `
      <div class="stat"><div class="stat-label">ステータス</div><div class="stat-value up">● 接続済み</div></div>
      <div class="stat"><div class="stat-label">対象アカウント</div><div class="stat-value">JKT + WKS</div></div>
      <div class="stat"><div class="stat-label">AIモデル</div><div class="stat-value">Claude Sonnet</div></div>
    `;
  } catch (e) {}
}

function addMessage(role, content) {
  const msg    = document.createElement('div');
  msg.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'ai' ? 'ai' : 'user-av'}`;
  avatar.textContent = role === 'ai' ? 'AI' : '私';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatText(content);

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function showTyping() {
  const msg    = document.createElement('div');
  msg.className = 'message ai';
  msg.id        = 'typing';

  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  avatar.textContent = 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  inputEl.value = '';
  autoResize(inputEl);

  showTyping();

  try {
    const res  = await fetch('/api/advisor', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ messages, clientId }),
    });

    const data = await res.json();
    hideTyping();

    if (data.content) {
      addMessage('ai', data.content);
      messages.push({ role: 'assistant', content: data.content });
    } else {
      addMessage('ai', 'エラーが発生しました。もう一度お試しください。');
    }

  } catch (e) {
    hideTyping();
    addMessage('ai', 'エラーが発生しました。もう一度お試しください。');
  }

  isLoading = false;
  sendBtn.disabled = false;
}

function sendQuick(text) {
  inputEl.value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function switchClient(id, btn) {
  clientId = id;
  document.querySelectorAll('.acc-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  messages = [];
  chatEl.innerHTML = '';
  addMessage('ai', `クライアント${id}のデータに切り替えました。何でも聞いてください。`);
}
</script>
</body>
</html>
