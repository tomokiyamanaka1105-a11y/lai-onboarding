<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-A-I AIアドバイザー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --bg2: #111118; --bg3: #1a1a24;
    --border: rgba(255,255,255,0.08); --text: #f0efe8; --text2: #9998a0;
    --accent: #c8f564; --accent2: rgba(200,245,100,0.1);
    --purple: #a78bfa; --purple2: rgba(167,139,250,0.1);
    --blue: #38bdf8; --blue2: rgba(56,189,248,0.1);
    --coral: #ff6b6b; --coral2: rgba(255,107,107,0.1);
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  .header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; flex-shrink: 0; }
  .logo span { color: var(--accent); }

  /* Account tabs */
  .account-tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .account-tabs::-webkit-scrollbar { display: none; }
  .acc-tab { padding: 5px 12px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 11px; cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; display: flex; align-items: center; gap: 5px; }
  .acc-tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent2); }
  .acc-tab .acc-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .acc-tab .acc-followers { font-size: 10px; opacity: 0.7; }
  .acc-tab-all { border-color: rgba(167,139,250,0.3); }
  .acc-tab-all.active { border-color: var(--purple); color: var(--purple); background: var(--purple2); }

  .status { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Account stats bar */
  .stats-bar { padding: 8px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; background: var(--bg2); }
  .stats-bar::-webkit-scrollbar { display: none; }
  .stat { flex-shrink: 0; }
  .stat-label { font-size: 9px; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; }
  .stat-value { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; margin-top: 1px; }
  .stat-value.up { color: var(--accent); }
  .stat-value.down { color: var(--coral); }
  .stat-divider { width: 1px; background: var(--border); flex-shrink: 0; }

  /* Chat */
  .chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .message { display: flex; gap: 10px; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .message.user { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .avatar.ai { background: var(--accent2); color: var(--accent); border: 1px solid rgba(200,245,100,0.2); }
  .avatar.me { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
  .bubble { max-width: calc(100% - 46px); padding: 11px 14px; border-radius: 16px; font-size: 14px; line-height: 1.65; }
  .message.ai .bubble { background: var(--bg2); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .message.user .bubble { background: var(--accent2); border: 1px solid rgba(200,245,100,0.2); border-top-right-radius: 4px; }
  .bubble img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; max-height: 180px; object-fit: cover; }
  .bubble video { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; max-height: 180px; }
  .bubble strong { font-weight: 600; }
  .bubble code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; font-family: monospace; font-size: 12px; color: var(--accent); }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0; }
  .bubble li { margin: 3px 0; }
  .model-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 100px; margin-bottom: 6px; background: var(--blue2); color: var(--blue); border: 1px solid rgba(56,189,248,0.2); }
  .account-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 100px; margin-bottom: 6px; background: var(--accent2); color: var(--accent); border: 1px solid rgba(200,245,100,0.2); margin-right: 4px; }

  /* Typing */
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text2); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  .loading-steps { padding: 4px 0; }
  .loading-step { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 8px; padding: 4px 0; transition: color 0.3s; }
  .loading-step.done { color: var(--accent); }
  .loading-step.active { color: var(--text); }
  .step-icon { width: 16px; text-align: center; font-size: 13px; }

  /* Bottom */
  .bottom { flex-shrink: 0; border-top: 1px solid var(--border); }
  .attachment-area { display: none; padding: 12px 20px 0; }
  .attachment-area.show { display: flex; gap: 10px; align-items: flex-start; }
  .attach-thumb { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
  .attach-thumb img, .attach-thumb video { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
  .attach-type { position: absolute; bottom: 4px; left: 4px; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 100px; }
  .attach-type.video { background: var(--blue); color: #000; }
  .attach-type.image { background: var(--purple); color: #fff; }
  .remove-attach { position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%; background: #ff4444; color: white; font-size: 11px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .attach-info { font-size: 12px; color: var(--text2); padding-top: 4px; line-height: 1.7; }
  .attach-info .hl { font-weight: 600; }
  .attach-info .hl.blue { color: var(--blue); }
  .attach-info .hl.purple { color: var(--purple); }
  .upload-progress { margin-top: 6px; }
  .progress-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--blue); border-radius: 2px; transition: width 0.3s; width: 0%; }
  .progress-text { font-size: 10px; color: var(--text2); margin-top: 3px; }
  .content-actions { display: none; padding: 10px 20px 0; gap: 6px; flex-wrap: wrap; }
  .content-actions.show { display: flex; }
  .ca-btn { padding: 6px 14px; border-radius: 100px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; border: 1px solid; }
  .ca-btn.green  { border-color: rgba(200,245,100,0.3); background: var(--accent2); color: var(--accent); }
  .ca-btn.purple { border-color: rgba(167,139,250,0.3); background: var(--purple2); color: var(--purple); }
  .ca-btn.blue   { border-color: rgba(56,189,248,0.3);  background: var(--blue2);   color: var(--blue); }
  .ca-btn.coral  { border-color: rgba(255,107,107,0.3); background: var(--coral2);  color: var(--coral); }
  .ca-btn:hover { opacity: 0.8; }
  .ca-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .video-note { margin: 8px 20px 0; padding: 8px 12px; background: var(--blue2); border: 1px solid rgba(56,189,248,0.2); border-radius: 10px; font-size: 11px; color: var(--blue); display: none; }
  .video-note.show { display: block; }
  .quick-replies { padding: 10px 20px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-btn { padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 11px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent2); }
  .input-area { padding: 10px 20px 20px; }
  .input-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; display: flex; gap: 10px; align-items: flex-end; transition: border-color 0.2s; }
  .input-box:focus-within { border-color: rgba(200,245,100,0.4); }
  .input-box textarea { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; line-height: 1.5; resize: none; max-height: 100px; min-height: 22px; font-family: inherit; }
  .input-box textarea::placeholder { color: var(--text2); }
  .img-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all 0.2s; flex-shrink: 0; }
  .img-btn:hover, .img-btn.has-file { border-color: var(--purple); color: var(--purple); background: var(--purple2); }
  .send-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--accent); color: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: opacity 0.2s; flex-shrink: 0; }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #file-input { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">L-<span>A</span>-I</div>
  <div class="account-tabs" id="accountTabs">
    <div class="acc-tab acc-tab-all active" data-account="all" onclick="switchAccount('all', this)">
      <div class="acc-dot"></div>全アカウント
    </div>
  </div>
  <div class="status"><div class="dot"></div></div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat"><div class="stat-label">読込中</div><div class="stat-value">—</div></div>
</div>

<div class="chat" id="chat"></div>

<div class="bottom">
  <div class="attachment-area" id="attachArea">
    <div class="attach-thumb">
      <img id="attachImg" src="" alt="" style="display:none;">
      <video id="attachVideo" muted playsinline style="display:none;"></video>
      <span class="attach-type" id="attachTypeLabel"></span>
      <button class="remove-attach" onclick="removeAttachment()">×</button>
    </div>
    <div class="attach-info" id="attachInfo">
      <div id="uploadStatus"></div>
      <div class="upload-progress" id="uploadProgress" style="display:none;">
        <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">アップロード中...</div>
      </div>
    </div>
  </div>

  <div class="video-note" id="videoNote">🎬 動画はGemini AIが全フレームを分析 → Claudeが日本語アドバイスを生成します</div>

  <div class="content-actions" id="contentActions">
    <button class="ca-btn green"  id="btnEval"    onclick="runContent('evaluate')">📊 投稿評価</button>
    <button class="ca-btn purple" id="btnCaption" onclick="runContent('caption')">✏️ キャプション</button>
    <button class="ca-btn blue"   id="btnHash"    onclick="runContent('hashtag')"># ハッシュタグ</button>
    <button class="ca-btn coral"  id="btnAll"     onclick="runContent('all')">✨ 全部まとめて</button>
  </div>

  <div class="quick-replies" id="quickReplies"></div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="input" placeholder="何でも聞いてください、または画像・動画を添付してください..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="img-btn" id="imgBtn" onclick="document.getElementById('file-input').click()">📎</button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
    <input type="file" id="file-input" accept="image/*,video/*" onchange="handleFile(event)">
  </div>
</div>

<script>
let GEMINI_API_KEY = '';
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwb8m0VOEHqBnEmWlA0X50zZruqF4CfpgUynLlfIj3EV8zNd5zQ3q2j1BnR0EFh96ks2g/exec';
const CLIENT_ID   = 'C001';

// State per account
const state = {
  all: { messages: [], label: '全アカウント' },
};
let currentAccount = 'all';
let accountsData   = [];
let isLoading      = false;
let attached       = null;

// DOM refs
const chatEl         = document.getElementById('chat');
const inputEl        = document.getElementById('input');
const sendBtn        = document.getElementById('sendBtn');
const attachArea     = document.getElementById('attachArea');
const contentActions = document.getElementById('contentActions');
const quickReplies   = document.getElementById('quickReplies');
const videoNote      = document.getElementById('videoNote');
const imgBtn         = document.getElementById('imgBtn');
const statsBar       = document.getElementById('statsBar');
const accountTabs    = document.getElementById('accountTabs');

// ── Init ──
window.addEventListener('load', async () => {
  // APIキー取得
  try {
    const r = await fetch('/api/get-config');
    const j = await r.json();
    GEMINI_API_KEY = j.geminiApiKey || '';
  } catch(e) {}

  // GASからアカウントデータ取得
  await loadAccountData();
  renderQuickReplies();
  addMsg('ai', 'all', `こんにちは！L-A-Iアドバイザーです。\n\n上のタブでアカウントを切り替えられます。\n**全アカウント**では横断分析、個別タブでは集中アドバイスができます。\n\n画像・動画を添付してコンテンツ評価・キャプション・ハッシュタグも生成できます。`);
});

async function loadAccountData() {
  try {
    const res  = await fetch(`${GAS_API_URL}?clientId=${CLIENT_ID}&type=all`);
    const json = await res.json();
    if (!json.success) return;

    accountsData = json.data.accounts;

    // タブを生成
    accountsData.forEach(acc => {
      const latest     = acc.dailyHistory?.[acc.dailyHistory.length - 1];
      const followers  = latest?.followerCount || 0;
      const tab = document.createElement('div');
      tab.className = 'acc-tab';
      tab.dataset.account = acc.igUserId;
      tab.innerHTML = `<div class="acc-dot"></div>${acc.accountName} <span class="acc-followers">${followers}人</span>`;
      tab.onclick = () => switchAccount(acc.igUserId, tab);
      accountTabs.appendChild(tab);

      // stateを初期化
      state[acc.igUserId] = { messages: [], label: acc.accountName };
    });

    renderStats('all');
  } catch(e) {
    statsBar.innerHTML = `<div class="stat"><div class="stat-label">データ取得失敗</div></div>`;
  }
}

function renderStats(accountId) {
  if (accountId === 'all') {
    // 全アカウント合計
    let totalReach = 0, totalFollowers = 0;
    accountsData.forEach(acc => {
      const latest = acc.dailyHistory?.[acc.dailyHistory.length - 1];
      totalFollowers += Number(latest?.followerCount) || 0;
      acc.dailyHistory?.forEach(d => totalReach += Number(d.reach) || 0);
    });
    statsBar.innerHTML = `
      <div class="stat"><div class="stat-label">総フォロワー</div><div class="stat-value">${totalFollowers}</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="stat-label">累計リーチ</div><div class="stat-value">${totalReach.toLocaleString()}</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="stat-label">アカウント数</div><div class="stat-value">${accountsData.length}</div></div>
    `;
  } else {
    const acc    = accountsData.find(a => a.igUserId === accountId);
    if (!acc) return;
    const latest = acc.dailyHistory?.[acc.dailyHistory.length - 1];
    const oldest = acc.dailyHistory?.[0];
    const totalReach = acc.dailyHistory?.reduce((s, d) => s + (Number(d.reach) || 0), 0) || 0;
    const delta  = (Number(latest?.followerCount) || 0) - (Number(oldest?.followerCount) || 0);
    statsBar.innerHTML = `
      <div class="stat"><div class="stat-label">フォロワー</div><div class="stat-value">${latest?.followerCount || 0}</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="stat-label">増減</div><div class="stat-value ${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '+' : ''}${delta}</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="stat-label">累計リーチ</div><div class="stat-value">${totalReach.toLocaleString()}</div></div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="stat-label">直近投稿リーチ</div><div class="stat-value">${latest?.reach || 0}</div></div>
    `;
  }
}

function renderQuickReplies() {
  const btns = currentAccount === 'all'
    ? ['先週の全体パフォーマンスを分析して', 'JKTとWKSを比較して', '両アカウントの投稿戦略を提案して', '来週の投稿プランを両方作って']
    : ['このアカウントの先週の分析をして', '最適な投稿時間を教えて', 'フォロワーを増やすには？', '来週の投稿プランを作って', 'キャプションの改善点は？'];
  quickReplies.innerHTML = btns.map(b =>
    `<button class="quick-btn" onclick="sendQuick('${b}')">${b}</button>`
  ).join('');
}

function switchAccount(accountId, tabEl) {
  currentAccount = accountId;
  document.querySelectorAll('.acc-tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  renderStats(accountId);
  renderQuickReplies();
  renderChat();

  // そのアカウントの初回メッセージ
  if (state[accountId]?.messages.length === 0) {
    const label = state[accountId]?.label || accountId;
    if (accountId === 'all') {
      addMsg('ai', accountId, 'すべてのアカウントを横断して分析します。JKTとWKSの比較や全体戦略を聞いてください。');
    } else {
      const acc = accountsData.find(a => a.igUserId === accountId);
      const latest = acc?.dailyHistory?.[acc.dailyHistory.length - 1];
      addMsg('ai', accountId, `**${label}** に切り替えました。\nフォロワー ${latest?.followerCount || 0}人 のデータを参照して回答します。`);
    }
  }
}

function renderChat() {
  chatEl.innerHTML = '';
  const msgs = state[currentAccount]?.messages || [];
  msgs.forEach(m => {
    if (m._rendered) {
      chatEl.appendChild(m._rendered.cloneNode(true));
    }
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ── Message rendering ──
function fmt(t) {
  return t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/`(.*?)`/g, '<code>$1</code>')
          .replace(/\n/g, '<br>');
}

function addMsg(role, accountId, content, mediaUrl = null, isVideo = false, isGemini = false) {
  const d  = document.createElement('div'); d.className = `message ${role}`;
  const av = document.createElement('div'); av.className = `avatar ${role === 'ai' ? 'ai' : 'me'}`; av.textContent = role === 'ai' ? 'AI' : '私';
  const b  = document.createElement('div'); b.className = 'bubble';

  if (role === 'ai' && accountId !== 'all' && currentAccount === 'all') {
    const tag = document.createElement('span');
    tag.className = 'account-tag';
    tag.textContent = state[accountId]?.label || accountId;
    b.appendChild(tag);
  }
  if (isGemini) {
    const badge = document.createElement('div'); badge.className = 'model-badge'; badge.textContent = '🎬 Gemini + Claude'; b.appendChild(badge);
  }

  const txt = document.createElement('div'); txt.innerHTML = fmt(content); b.appendChild(txt);

  if (mediaUrl) {
    if (isVideo) { const v = document.createElement('video'); v.src = mediaUrl; v.controls = true; v.muted = true; b.appendChild(v); }
    else { const i = document.createElement('img'); i.src = mediaUrl; b.appendChild(i); }
  }

  d.appendChild(av); d.appendChild(b);

  // stateに保存
  if (!state[accountId]) state[accountId] = { messages: [], label: accountId };
  state[accountId].messages.push({ role, content, _rendered: d });

  // 現在のアカウントなら表示
  if (accountId === currentAccount) {
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
}

function showTyping(steps = null) {
  const d  = document.createElement('div'); d.className = 'message ai'; d.id = 'typing';
  const av = document.createElement('div'); av.className = 'avatar ai'; av.textContent = 'AI';
  const b  = document.createElement('div'); b.className = 'bubble';
  if (steps) {
    const sl = document.createElement('div'); sl.className = 'loading-steps';
    steps.forEach((s, i) => {
      const row = document.createElement('div'); row.className = `loading-step ${i === 0 ? 'active' : ''}`; row.id = `step-${i}`;
      row.innerHTML = `<span class="step-icon">${i === 0 ? '⟳' : '○'}</span><span>${s}</span>`;
      sl.appendChild(row);
    });
    b.appendChild(sl);
  } else {
    b.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  }
  d.appendChild(av); d.appendChild(b); chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function updateStep(idx) {
  document.querySelectorAll('.loading-step').forEach((s, i) => {
    const icon = s.querySelector('.step-icon');
    if (i < idx)       { s.className = 'loading-step done';   icon.textContent = '✓'; }
    else if (i === idx) { s.className = 'loading-step active'; icon.textContent = '⟳'; }
  });
}

function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

// ── Attachment ──
function setContentBtns(disabled) {
  ['btnEval','btnCaption','btnHash','btnAll'].forEach(id => { document.getElementById(id).disabled = disabled; });
}

function updateAttachUI(hasFile) {
  attachArea.classList.toggle('show', hasFile);
  contentActions.style.display = hasFile ? 'flex' : 'none';
  quickReplies.style.display   = hasFile ? 'none' : 'flex';
  imgBtn.classList.toggle('has-file', hasFile);
  videoNote.classList.toggle('show', hasFile && attached?.isVideo);
}

async function uploadToGemini(file) {
  const progressBar  = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const uploadProg   = document.getElementById('uploadProgress');
  uploadProg.style.display = 'block';

  const startRes = await fetch(
    `https://generativelanguage.googleapis.com/upload/v1beta/files?key=${GEMINI_API_KEY}`,
    { method: 'POST', headers: { 'X-Goog-Upload-Protocol': 'resumable', 'X-Goog-Upload-Command': 'start', 'X-Goog-Upload-Header-Content-Length': file.size, 'X-Goog-Upload-Header-Content-Type': file.type, 'Content-Type': 'application/json' }, body: JSON.stringify({ file: { display_name: file.name } }) }
  );
  const uploadUrl = startRes.headers.get('X-Goog-Upload-URL');
  if (!uploadUrl) throw new Error('Upload URL取得失敗');

  progressBar.style.width = '30%'; progressText.textContent = 'Geminiにアップロード中...';

  const uploadRes  = await fetch(uploadUrl, { method: 'POST', headers: { 'X-Goog-Upload-Command': 'upload, finalize', 'X-Goog-Upload-Offset': '0', 'Content-Type': file.type }, body: file });
  const uploadJson = await uploadRes.json();
  const fileUri    = uploadJson?.file?.uri;
  const fileName   = uploadJson?.file?.name;
  if (!fileUri) throw new Error('fileUri取得失敗');

  progressBar.style.width = '80%'; progressText.textContent = '処理中...';
  let state2 = uploadJson?.file?.state;
  let attempts = 0;
  while (state2 === 'PROCESSING' && attempts < 20) {
    await new Promise(r => setTimeout(r, 2000));
    const s = await fetch(`https://generativelanguage.googleapis.com/v1beta/${fileName}?key=${GEMINI_API_KEY}`);
    const j = await s.json(); state2 = j?.state; attempts++;
    progressBar.style.width = `${80 + attempts}%`;
  }

  progressBar.style.width = '100%'; progressText.textContent = 'アップロード完了！';
  setTimeout(() => { uploadProg.style.display = 'none'; }, 1000);
  return fileUri;
}

async function handleFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const isVideo = f.type.startsWith('video');
  const url = URL.createObjectURL(f);
  e.target.value = '';

  if (isVideo) {
    document.getElementById('attachImg').style.display = 'none';
    const vEl = document.getElementById('attachVideo'); vEl.src = url; vEl.style.display = 'block';
    document.getElementById('attachTypeLabel').textContent = '動画'; document.getElementById('attachTypeLabel').className = 'attach-type video';
  } else {
    document.getElementById('attachVideo').style.display = 'none';
    const iEl = document.getElementById('attachImg'); iEl.src = url; iEl.style.display = 'block';
    document.getElementById('attachTypeLabel').textContent = '画像'; document.getElementById('attachTypeLabel').className = 'attach-type image';
  }

  attached = { type: f.type, url, isVideo, fileUri: null, data: null };
  updateAttachUI(true); setContentBtns(true);

  if (isVideo) {
    document.getElementById('uploadStatus').innerHTML = `<span class="hl blue">🎬 動画を添付しました</span><br>Gemini File APIにアップロード中...`;
    try {
      const fileUri = await uploadToGemini(f);
      attached.fileUri = fileUri;
      document.getElementById('uploadStatus').innerHTML = `<span class="hl blue">🎬 動画 アップロード完了</span><br>下のボタンで分析してください`;
      setContentBtns(false);
    } catch (err) {
      document.getElementById('uploadStatus').innerHTML = `<span style="color:#ff6b6b;">⚠️ アップロード失敗: ${err.message}</span>`;
      attached = null; updateAttachUI(false);
    }
  } else {
    const r = new FileReader();
    r.onload = ev => {
      attached.data = ev.target.result.split(',')[1];
      document.getElementById('uploadStatus').innerHTML = `<span class="hl purple">🖼️ 画像を添付しました</span><br>下のボタンで分析してください`;
      setContentBtns(false);
    };
    r.readAsDataURL(f);
  }
}

function removeAttachment() {
  attached = null;
  document.getElementById('attachImg').src = ''; document.getElementById('attachImg').style.display = 'none';
  document.getElementById('attachVideo').src = ''; document.getElementById('attachVideo').style.display = 'none';
  updateAttachUI(false);
}

// ── Send ──
async function sendMessage(overridePrompt = null) {
  const text = overridePrompt || inputEl.value.trim();
  if (!text && !attached) return;
  if (isLoading) return;
  isLoading = true; sendBtn.disabled = true;

  const accountId  = currentAccount;
  const usedAttach = attached ? { ...attached } : null;
  addMsg('user', accountId, text || (usedAttach?.isVideo ? '（動画を送信）' : '（画像を送信）'), usedAttach?.url, usedAttach?.isVideo || false);

  if (!overridePrompt) { inputEl.value = ''; autoResize(inputEl); }
  attached = null; updateAttachUI(false);

  // メッセージ履歴
  const msgs = state[accountId]?.messages
    .filter(m => m.role === 'user' || m.role === 'assistant')
    .map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) || [];

  if (usedAttach?.isVideo && usedAttach?.fileUri) {
    showTyping(['Geminiが動画を全フレーム分析中...', 'Claudeが日本語アドバイスを生成中...']);
    try {
      const res  = await fetch('/api/advisor-video', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fileUri: usedAttach.fileUri, videoMimeType: usedAttach.type, clientId: CLIENT_ID, igUserId: accountId === 'all' ? null : accountId, prompt: text || '全部まとめて評価してください。' }) });
      updateStep(1);
      const data = await res.json();
      hideTyping();
      if (data.content) addMsg('ai', accountId, data.content, null, false, true);
      else addMsg('ai', accountId, `エラー: ${data.geminiAnalysis || '不明'}`);
    } catch (e) { hideTyping(); addMsg('ai', accountId, `エラー: ${e.message}`); }

  } else {
    const uc = [];
    if (usedAttach?.data) uc.push({ type: 'image', source: { type: 'base64', media_type: usedAttach.type, data: usedAttach.data } });
    if (text) uc.push({ type: 'text', text });
    const lastContent = uc.length === 1 && uc[0].type === 'text' ? text : uc;
    const sendMsgs = [...msgs.slice(0, -1), { role: 'user', content: lastContent }];

    showTyping();
    try {
      const res  = await fetch('/api/advisor', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: sendMsgs, clientId: CLIENT_ID, igUserId: accountId === 'all' ? null : accountId }) });
      const data = await res.json();
      hideTyping();
      if (data.content) addMsg('ai', accountId, data.content);
      else addMsg('ai', accountId, 'エラーが発生しました。');
    } catch (e) { hideTyping(); addMsg('ai', accountId, 'エラーが発生しました。'); }
  }

  isLoading = false; sendBtn.disabled = false;
}

function runContent(type) {
  if (!attached) { alert('先にファイルを添付してください'); return; }
  const prompts = {
    evaluate: '投稿として詳しく評価してください。スコア・強み・改善点・予想パフォーマンスを過去データと比較して。',
    caption:  'この投稿に合うInstagramキャプションを3パターン生成してください。過去の成功投稿の傾向を踏まえて。インバウンド向けは日英バイリンガルで。',
    hashtag:  'この投稿に最適なハッシュタグを提案してください。必須タグ・ニッチタグ・バイラルタグ・インバウンド英語タグのカテゴリ別に。',
    all:      '以下を全部まとめてください: ①投稿評価（スコア・強み・改善点）②キャプション案3パターン ③ハッシュタグ提案（カテゴリ別）④最適な投稿タイミング',
  };
  inputEl.value = prompts[type]; sendMessage();
}

function sendQuick(t) { inputEl.value = t; sendMessage(); }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
</script>
