<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L-A-I AIアドバイザー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --bg2: #111118; --bg3: #1a1a24;
    --border: rgba(255,255,255,0.08); --text: #f0efe8; --text2: #9998a0;
    --accent: #c8f564; --accent2: rgba(200,245,100,0.1);
    --purple: #a78bfa; --purple2: rgba(167,139,250,0.1);
    --blue: #38bdf8; --blue2: rgba(56,189,248,0.1);
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  .header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .badge { font-size: 10px; font-weight: 600; color: var(--accent); background: var(--accent2); padding: 3px 8px; border-radius: 100px; }
  .status { margin-left: auto; font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Chat */
  .chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .message { display: flex; gap: 10px; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .message.user { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .avatar.ai { background: var(--accent2); color: var(--accent); border: 1px solid rgba(200,245,100,0.2); }
  .avatar.me { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
  .bubble { max-width: calc(100% - 46px); padding: 11px 14px; border-radius: 16px; font-size: 14px; line-height: 1.65; }
  .message.ai .bubble { background: var(--bg2); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .message.user .bubble { background: var(--accent2); border: 1px solid rgba(200,245,100,0.2); border-top-right-radius: 4px; }
  .bubble img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; max-height: 200px; object-fit: cover; }
  .bubble strong { font-weight: 600; }
  .bubble code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; font-family: monospace; font-size: 12px; color: var(--accent); }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0; }
  .bubble li { margin: 3px 0; }

  /* Typing */
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text2); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* Bottom area */
  .bottom { flex-shrink: 0; border-top: 1px solid var(--border); }

  /* Image preview */
  .img-preview-area { display: none; padding: 12px 20px 0; }
  .img-preview-area.show { display: flex; gap: 10px; align-items: flex-start; }
  .preview-thumb { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
  .preview-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
  .remove-thumb { position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%; background: #ff4444; color: white; font-size: 11px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .preview-label { font-size: 12px; color: var(--text2); padding-top: 4px; line-height: 1.5; }
  .preview-label strong { color: var(--purple); font-size: 12px; }

  /* Content action buttons - shown when image is attached */
  .content-actions { display: none; padding: 10px 20px 0; gap: 6px; flex-wrap: wrap; }
  .content-actions.show { display: flex; }
  .ca-btn { padding: 6px 14px; border-radius: 100px; border: 1px solid rgba(167,139,250,0.3); background: var(--purple2); color: var(--purple); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .ca-btn:hover { background: rgba(167,139,250,0.2); border-color: var(--purple); }
  .ca-btn.accent { border-color: rgba(200,245,100,0.3); background: var(--accent2); color: var(--accent); }
  .ca-btn.accent:hover { background: rgba(200,245,100,0.2); }
  .ca-btn.blue { border-color: rgba(56,189,248,0.3); background: var(--blue2); color: var(--blue); }
  .ca-btn.blue:hover { background: rgba(56,189,248,0.2); }

  /* Quick replies */
  .quick-replies { padding: 10px 20px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-btn { padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 11px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent2); }

  /* Input */
  .input-area { padding: 10px 20px 20px; }
  .input-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; display: flex; gap: 10px; align-items: flex-end; transition: border-color 0.2s; }
  .input-box:focus-within { border-color: rgba(200,245,100,0.4); }
  .input-box textarea { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; line-height: 1.5; resize: none; max-height: 100px; min-height: 22px; font-family: inherit; }
  .input-box textarea::placeholder { color: var(--text2); }
  .img-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all 0.2s; flex-shrink: 0; }
  .img-btn:hover, .img-btn.active { border-color: var(--purple); color: var(--purple); background: var(--purple2); }
  .send-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--accent); color: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: opacity 0.2s; flex-shrink: 0; }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #file-input { display: none; }

  /* Copy button in results */
  .copy-inline { padding: 3px 9px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); font-size: 10px; cursor: pointer; margin-left: 8px; vertical-align: middle; }
  .copy-inline:hover { border-color: var(--accent); color: var(--accent); }
  .hashtag-tag { display: inline-block; padding: 3px 9px; border-radius: 100px; background: var(--blue2); border: 1px solid rgba(56,189,248,0.2); color: var(--blue); font-size: 12px; cursor: pointer; margin: 2px; }
  .hashtag-tag:hover { background: rgba(56,189,248,0.25); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">L-<span>A</span>-I</div>
  <div class="badge">AIアドバイザー</div>
  <div class="status"><div class="dot"></div>オンライン</div>
</div>

<div class="chat" id="chat"></div>

<div class="bottom">
  <!-- Image preview area -->
  <div class="img-preview-area" id="imgPreviewArea">
    <div class="preview-thumb">
      <img id="previewThumb" src="" alt="">
      <button class="remove-thumb" onclick="removeImage()">×</button>
    </div>
    <div class="preview-label">
      <strong>画像を添付済み</strong><br>
      下のボタンで分析、またはテキストで指示を送ってください
    </div>
  </div>

  <!-- Content action buttons (image attached) -->
  <div class="content-actions" id="contentActions">
    <button class="ca-btn accent" onclick="runContent('evaluate')">📊 投稿評価</button>
    <button class="ca-btn" onclick="runContent('caption')">✏️ キャプション生成</button>
    <button class="ca-btn blue" onclick="runContent('hashtag')"># ハッシュタグ</button>
    <button class="ca-btn" onclick="runContent('all')">✨ 全部まとめて</button>
  </div>

  <!-- Quick replies (no image) -->
  <div class="quick-replies" id="quickReplies">
    <button class="quick-btn" onclick="sendQuick('先週のパフォーマンスを分析して')">先週の分析</button>
    <button class="quick-btn" onclick="sendQuick('最適な投稿時間を教えて')">最適投稿時間</button>
    <button class="quick-btn" onclick="sendQuick('リールとカルーセルどちらを増やすべき？')">形式の比較</button>
    <button class="quick-btn" onclick="sendQuick('フォロワーを増やすために今すぐできることは？')">フォロワー増加</button>
    <button class="quick-btn" onclick="sendQuick('JKTとWKSを比較してどちらに注力すべき？')">アカウント比較</button>
    <button class="quick-btn" onclick="sendQuick('来週の投稿プランを作って')">投稿プラン</button>
    <button class="quick-btn" onclick="sendQuick('広告に¥5,000使うとしたらどう使う？')">広告戦略</button>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-box">
      <textarea id="input" placeholder="何でも聞いてください、または画像を添付してください..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="img-btn" id="imgBtn" onclick="document.getElementById('file-input').click()" title="画像を添付">📎</button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
    <input type="file" id="file-input" accept="image/*,video/*" onchange="handleFile(event)">
  </div>
</div>

<script>
const chatEl         = document.getElementById('chat');
const inputEl        = document.getElementById('input');
const sendBtn        = document.getElementById('sendBtn');
const imgPreviewArea = document.getElementById('imgPreviewArea');
const contentActions = document.getElementById('contentActions');
const quickReplies   = document.getElementById('quickReplies');
const imgBtn         = document.getElementById('imgBtn');

let messages     = [];
let clientId     = 'C001';
let isLoading    = false;
let attachedImage = null; // { data, type, url }

// Init
window.addEventListener('load', () => {
  addMsg('ai', 'こんにちは！L-A-Iアドバイザーです。\n\nJKTとWKSのデータを参照してリアルタイムでアドバイスします。\n\n**チャット**: データについて何でも質問\n**画像添付**: 📎で投稿予定の画像を添付して評価・キャプション・ハッシュタグを生成\n\n何でも聞いてください！');
});

// ── Helpers ──
function fmt(t) {
  return t
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function addMsg(role, content, imgUrl = null) {
  const d  = document.createElement('div');
  d.className = `message ${role}`;
  const av = document.createElement('div');
  av.className = `avatar ${role === 'ai' ? 'ai' : 'me'}`;
  av.textContent = role === 'ai' ? 'AI' : '私';
  const b  = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = fmt(content);
  if (imgUrl) {
    const img = document.createElement('img');
    img.src = imgUrl;
    b.appendChild(img);
  }
  d.appendChild(av); d.appendChild(b);
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showTyping() {
  const d  = document.createElement('div'); d.className = 'message ai'; d.id = 'typing';
  const av = document.createElement('div'); av.className = 'avatar ai'; av.textContent = 'AI';
  const b  = document.createElement('div'); b.className = 'bubble';
  b.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  d.appendChild(av); d.appendChild(b); chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function updateImageUI(hasImage) {
  imgPreviewArea.classList.toggle('show', hasImage);
  contentActions.style.display  = hasImage ? 'flex' : 'none';
  quickReplies.style.display    = hasImage ? 'none' : 'flex';
  imgBtn.classList.toggle('active', hasImage);
}

// ── File handling ──
function handleFile(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    attachedImage = {
      data: ev.target.result.split(',')[1],
      type: f.type.startsWith('video') ? 'image/jpeg' : f.type,
      url:  ev.target.result,
    };
    document.getElementById('previewThumb').src = ev.target.result;
    updateImageUI(true);
  };
  r.readAsDataURL(f);
  e.target.value = '';
}

function removeImage() {
  attachedImage = null;
  document.getElementById('previewThumb').src = '';
  updateImageUI(false);
}

// ── Send message ──
async function sendMessage(overrideText = null) {
  const text = overrideText || inputEl.value.trim();
  if (!text && !attachedImage) return;
  if (isLoading) return;

  isLoading = true; sendBtn.disabled = true;

  // Show user message
  addMsg('user', text || '（画像を送信）', attachedImage?.url || null);

  // Build content
  const uc = [];
  if (attachedImage) uc.push({ type: 'image', source: { type: 'base64', media_type: attachedImage.type, data: attachedImage.data } });
  if (text)          uc.push({ type: 'text', text });
  const msgContent = uc.length === 1 && uc[0].type === 'text' ? text : uc;
  messages.push({ role: 'user', content: msgContent });

  // Clear input
  if (!overrideText) { inputEl.value = ''; autoResize(inputEl); }
  const usedImage = attachedImage;
  if (attachedImage) { attachedImage = null; updateImageUI(false); }

  showTyping();

  try {
    const res  = await fetch('/api/advisor', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, clientId }),
    });
    const data = await res.json();
    hideTyping();

    if (data.content) {
      // Render special content for hashtags
      if (data.content.includes('#') && data.content.match(/#[\w\u3040-\u30FF\u3400-\u9FFF]+/g)) {
        addMsgWithHashtags('ai', data.content);
      } else {
        addMsg('ai', data.content);
      }
      messages.push({ role: 'assistant', content: data.content });
    } else {
      addMsg('ai', 'エラーが発生しました。もう一度お試しください。');
    }
  } catch (e) {
    hideTyping();
    addMsg('ai', 'エラーが発生しました。もう一度お試しください。');
  }

  isLoading = false; sendBtn.disabled = false;
}

// Special render for hashtag results
function addMsgWithHashtags(role, content) {
  const d  = document.createElement('div'); d.className = `message ${role}`;
  const av = document.createElement('div'); av.className = 'avatar ai'; av.textContent = 'AI';
  const b  = document.createElement('div'); b.className = 'bubble';

  // Split text and extract hashtags
  const tags = content.match(/#[\w\u3040-\u30FF\u3400-\u9FFF]+/g) || [];
  b.innerHTML = fmt(content);

  // Add copy all button if hashtags found
  if (tags.length > 0) {
    const copyAllBtn = document.createElement('button');
    copyAllBtn.style.cssText = 'margin-top:12px;padding:7px 16px;border-radius:100px;border:1px solid var(--blue);background:var(--blue2);color:var(--blue);font-size:12px;cursor:pointer;display:block;width:100%;';
    copyAllBtn.textContent = '# 全てのハッシュタグをコピー';
    copyAllBtn.onclick = () => {
      navigator.clipboard.writeText(tags.join(' '));
      copyAllBtn.textContent = '✓ コピーしました';
      setTimeout(() => copyAllBtn.textContent = '# 全てのハッシュタグをコピー', 2000);
    };
    b.appendChild(copyAllBtn);
  }

  d.appendChild(av); d.appendChild(b);
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ── Content analysis shortcuts ──
function runContent(type) {
  if (!attachedImage) { alert('先に画像を添付してください'); return; }

  const prompts = {
    evaluate: 'この画像を投稿として評価してください。スコア・強み・改善点・予想パフォーマンスを過去データと比較して教えてください。',
    caption:  'この画像に合うInstagramキャプションを3パターン生成してください。過去の成功投稿の傾向を踏まえて、アカウントに合ったものにしてください。インバウンド向けは日英バイリンガルで。',
    hashtag:  'この画像に最適なハッシュタグを提案してください。必須タグ・ニッチタグ・バイラルタグ・インバウンド向け英語タグのカテゴリ別に。',
    all:      'この投稿予定の画像について以下を全部まとめてください: ①投稿評価（スコア・強み・改善点）②キャプション案3パターン ③ハッシュタグ提案（カテゴリ別）④最適な投稿タイミング',
  };

  inputEl.value = prompts[type];
  sendMessage();
}

// ── Other helpers ──
function sendQuick(t) { inputEl.value = t; sendMessage(); }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
</script>
</body>
</html>
